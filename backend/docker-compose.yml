services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: blockfire
      POSTGRES_PASSWORD: blockfire
      POSTGRES_DB: blockfire_stats
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockfire -d blockfire_stats"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://blockfire:blockfire@db:5432/blockfire_stats
      INGEST_TOKEN: ${INGEST_TOKEN:-change-me-in-prod}
      # M9-P1 signed match reports (ADR-0011). Space/comma-separated key_id:secret
      # pairs; any configured key is an official/trusted signer. REQUIRE_SIGNED_INGEST
      # rejects unsigned POSTs (prod); default false keeps M20 dev servers working.
      INGEST_SIGNING_KEYS: ${INGEST_SIGNING_KEYS:-}
      REQUIRE_SIGNED_INGEST: ${REQUIRE_SIGNED_INGEST:-false}
      INGEST_MAX_SKEW_S: ${INGEST_MAX_SKEW_S:-300}
      RAW_EVENT_RETENTION_DAYS: ${RAW_EVENT_RETENTION_DAYS:-90}
      STEAM_WEB_API_KEY: ${STEAM_WEB_API_KEY:-}
      SESSION_SECRET: ${SESSION_SECRET:-dev-insecure-change-me}
      SITE_BASE_URL: ${SITE_BASE_URL:-http://localhost:8000}
      ADMIN_STEAM_IDS: ${ADMIN_STEAM_IDS:-}
      ADMIN_DEV_OPEN: ${ADMIN_DEV_OPEN:-false}
      ANOMALY_KD_FLOOR: ${ANOMALY_KD_FLOOR:-4.0}
      ANOMALY_HEADSHOT_RATE_FLOOR: ${ANOMALY_HEADSHOT_RATE_FLOOR:-0.6}
      ANOMALY_HIT_RATE_FLOOR: ${ANOMALY_HIT_RATE_FLOOR:-0.55}
      ANOMALY_MIN_DEATHS: ${ANOMALY_MIN_DEATHS:-5}
      ANOMALY_MIN_KILLS: ${ANOMALY_MIN_KILLS:-10}
      ANOMALY_MIN_HITS: ${ANOMALY_MIN_HITS:-40}
      ANOMALY_MIN_SHOTS: ${ANOMALY_MIN_SHOTS:-100}
      ANOMALY_MIN_POPULATION: ${ANOMALY_MIN_POPULATION:-5}
      ANOMALY_MAD_K: ${ANOMALY_MAD_K:-3.5}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "worker.run"]
    environment:
      DATABASE_URL: postgresql+asyncpg://blockfire:blockfire@db:5432/blockfire_stats
      INGEST_TOKEN: ${INGEST_TOKEN:-change-me-in-prod}
      RAW_EVENT_RETENTION_DAYS: ${RAW_EVENT_RETENTION_DAYS:-90}
      STEAM_WEB_API_KEY: ${STEAM_WEB_API_KEY:-}
      SESSION_SECRET: ${SESSION_SECRET:-dev-insecure-change-me}
      SITE_BASE_URL: ${SITE_BASE_URL:-http://localhost:8000}
      ANOMALY_KD_FLOOR: ${ANOMALY_KD_FLOOR:-4.0}
      ANOMALY_HEADSHOT_RATE_FLOOR: ${ANOMALY_HEADSHOT_RATE_FLOOR:-0.6}
      ANOMALY_HIT_RATE_FLOOR: ${ANOMALY_HIT_RATE_FLOOR:-0.55}
      ANOMALY_MIN_DEATHS: ${ANOMALY_MIN_DEATHS:-5}
      ANOMALY_MIN_KILLS: ${ANOMALY_MIN_KILLS:-10}
      ANOMALY_MIN_HITS: ${ANOMALY_MIN_HITS:-40}
      ANOMALY_MIN_SHOTS: ${ANOMALY_MIN_SHOTS:-100}
      ANOMALY_MIN_POPULATION: ${ANOMALY_MIN_POPULATION:-5}
      ANOMALY_MAD_K: ${ANOMALY_MAD_K:-3.5}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
