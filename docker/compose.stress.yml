# Stress run (STUB — validated in M8): 1 server + 128 bots (4 x 32).
# Target one-command stress test for the M8 gate.
services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    environment:
      PORT: "27015"
    ports:
      - "27015:27015/udp"

  bots:
    build:
      context: ..
      dockerfile: docker/Dockerfile.bots
    environment:
      BOT_COUNT: "32"
      SERVER_HOST: "server"
      PORT: "27015"
    depends_on:
      - server
    deploy:
      replicas: 4   # 4 x 32 = 128 simulated players
