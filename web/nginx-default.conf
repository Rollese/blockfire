# Blockfire static site — overrides nginx:alpine's stock default.conf.
# Only change vs. stock: a branded 404 page. Everything else (index.html for
# directories, the /dir -> /dir/ redirect) is stock nginx behaviour, which is
# what the friendly-URL layout relies on.
server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Sensible baseline security headers (static marketing site).
    add_header X-Content-Type-Options   "nosniff"                        always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           "SAMEORIGIN"                     always;

    # Serve the branded 404 for any unmatched path.
    error_page 404 /404.html;
    location = /404.html { internal; }

    # nginx:alpine's mime.types lacks .webmanifest; set the correct type.
    location = /site.webmanifest { default_type application/manifest+json; }
}
